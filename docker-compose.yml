# Production topology: one container beside n8n on the same VPS, on n8n's Docker network,
# exactly like trustpilot-reviews (8000) and reddit-reviews (8001).
#
# There is no reverse proxy and no public route here. n8n reaches the API by container name
# over the shared network (http://facebook-ad-library:8002), so nothing is published to the host
# and nothing is reachable from the internet. The VPS already runs Traefik on 80/443 for n8n's
# own UI - do not add a second proxy, it would fail to bind.
#
# Memory model. This is a single Python process with curl_cffi; no browser is ever launched.
# A search holds one ~200 KB response at a time and the result cache is bounded by
# CACHE_MAX_ENTRIES (~50 KB each, 2000 entries = ~100 MB at the very most). 512m is a
# blast-radius guard for the host, not a working budget: hitting it means something leaked.
services:
  scraper:
    build: .
    image: facebook-ad-library:latest
    container_name: facebook-ad-library
    restart: unless-stopped
    env_file: .env

    # No `ports:` on purpose. Publishing would expose the API on the host - and Docker
    # publishes straight past UFW, so even 8002:8002 behind a firewall would be public.
    # Reachable only from containers on the network below. To poke at it from the host:
    #   docker exec facebook-ad-library python -c "import urllib.request as u; \
    #     print(u.urlopen('http://127.0.0.1:8002/health').read())"
    networks:
      - n8n

    mem_limit: 512m
    memswap_limit: 512m
    mem_reservation: 128m

    # No `init`, `pids_limit` or `shm_size` here: those exist in the siblings for Chromium's
    # process trees and shared memory, and this image has no browser.

    # Docker's default is 10s, which SIGKILLs every in-flight search on redeploy: uvicorn stops
    # accepting and waits for the handler, and that handler may legitimately run for
    # SCRAPE_BUDGET_S. 250s is that budget plus slack. Raise it with SCRAPE_BUDGET_S, never below it.
    stop_grace_period: 250s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# n8n's Compose project creates this network as <project>_default. Declared external so this
# file never creates or owns it - n8n's stack does. If the name is wrong the container refuses
# to start with `network n8n_default declared as external, but could not be found`, which names
# the fix; check with `docker network ls`. Nothing else is affected when it fails.
networks:
  n8n:
    external: true
    name: n8n_default
